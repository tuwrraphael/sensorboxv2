    hex: FFFFFF
  - id: grey
    hex: AAAAAA
  - id: light_grey
    hex: CCCCCC
  - id: yellow
    hex: FFFA72
  - id: orange
    hex: FF9C32
  - id: red
    hex: FF1616
  - id: purple
    hex: FF16e0
  - id: meter_high
    hex: db4437
  - id: meter_low
    hex: 43a047
  - id: meter_medium
    hex: ffa600

lvgl:
  rotation: 90
  pages:
        - id: gauge_page
          widgets:
            - obj:
                align: CENTER
                layout:
                  type: GRID
                  grid_columns: [FR(1), FR(1)]
                  grid_rows: [FR(1), FR(1)]
                height: 240
                width: 320
                bg_color: 0xFFFFFF
                border_width: 0
                pad_all: 0
                widgets:
                  - obj:
                      border_width: 0
                      pad_all: 2
                      grid_cell_column_pos: 0
                      grid_cell_row_pos: 0
                      grid_cell_x_align: STRETCH
                      grid_cell_y_align: STRETCH
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            text_font: font_value_16
                            text: "Partikel < 2.5µm"
                            flex_grow: 0
                        - obj:
                            width: 100%
                            border_width: 0
                            pad_all: 0
                            flex_grow: 1
                            scrollbar_mode: "OFF"
                            widgets:
                              - meter:
                                  height: 152
                                  width: 152
                                  y: 6
                                  border_width: 0
                                  bg_opa: TRANSP
                                  scales:
                                    - range_from: 0
                                      range_to: 25
                                      angle_range: 180 # sets the total angle to 180 = starts mid left and ends mid right
                                      ticks:
                                        count: 2
                                        width: 0
                                      indicators:
                                        - line:
                                            id: val_pm25
                                            width: 2
                                            length: 65 # sets line length by this much difference from the scale default radius
                                            value: -2
                                        - arc: # first half of the scale background
                                            color: meter_low
                                            r_mod: 10 # radius difference from the scale default radius
                                            width: 20
                                            start_value: 0
                                            end_value: 5
                                        - arc: # second half of the scale background
                                            color: meter_medium
                                            r_mod: 10
                                            width: 20
                                            start_value: 5
                                            end_value: 15
                                        - arc: # second half of the scale background
                                            color: meter_high
                                            r_mod: 10
                                            width: 20
                                            start_value: 15
                                            end_value: 25
                              - obj: # to cover the middle part of meter indicator line
                                  height: 90
                                  width: 90
                                  radius: 45
                                  align: BOTTOM_MID
                                  border_width: 0
                                  bg_color: 0xFFFFFF
                                  pad_all: 0
                                  y: 42
                              - label: # gauge numeric indicator
                                  id: text_pm25
                                  text_font: font_value_16
                                  y: -10
                                  align: BOTTOM_MID
                                  text: "0 µg/m³"
                  - obj:
                      border_width: 0
                      pad_all: 2
                      grid_cell_column_pos: 1
                      grid_cell_row_pos: 0
                      grid_cell_x_align: STRETCH
                      grid_cell_y_align: STRETCH
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            text_font: font_value_16
                            text: "CO₂"
                            flex_grow: 0
                        - obj:
                            width: 100%
                            border_width: 0
                            pad_all: 0
                            flex_grow: 1
                            scrollbar_mode: "OFF"
                            widgets:
                              - meter:
                                  height: 152
                                  width: 152
