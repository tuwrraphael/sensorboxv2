substitutions:
  name: raumklimasensor-<TODO>
  friendly_name: Raumklimasensor

# Sensorbox v2 config for PCB SBR1 by Thomas Sanladerer
# The Sensorbox v2 is licensed under CC BY 4.0
# https://www.printables.com/model/1079858-3d-printer-emission-sensor-array-sensorbox-v2

psram:
  mode: quad

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.11.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio
  project:
    name: esphome.web
    version: dev

esp32:
  board: esp32-s2-saola-1
  framework:
    type: arduino
# Enable logging
logger:

# Enable Home Assistant API and failsafe mechanisms
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  # ssid: !secret wifi_ssid
  # password: !secret wifi_password

  # Main configuration of wifi via the access point
  ap:
    ssid: ${name} setup
    password: <TODO>


# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

dashboard_import:
  package_import_url: github://esphome/firmware/esphome-web/esp32s2.yaml@main
  import_full_config: true

# To have a "next url" for improv serial
web_server:



debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"


# Display dimming
globals:
   - id: dbright
     type: int
     restore_value: no
     initial_value: '0'
     
output:
  - platform: ledc
    pin: GPIO15
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off: 
      then:
        - lambda: |-
            id(display0).command(0x10);
    on_turn_on: 
      then:
        - lambda: |-
            id(display0).command(0x11);
        

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    id: top_btn
    filters:
      - delayed_on: 10ms
      - delayed_off: 500ms
    on_press: 
      then:
        - lambda: |-
            switch(id(dbright)){
            case 0: id(dbright) = 3; id(back_light).turn_on().set_brightness(1.00).perform(); return;
            case 1: id(dbright) = 0; id(back_light).turn_off().perform();                     return;
            case 2: id(dbright) = 1; id(back_light).turn_on().set_brightness(0.05).perform(); return;
            case 3: id(dbright) = 2; id(back_light).turn_on().set_brightness(0.33).perform(); return;
            }
  - platform: gpio
    pin:
      number: GPIO35
      mode:
        input: true
        pullup: true
      inverted: true
    id: front_btn
    on_click: 
      - min_length: 10ms
        max_length: 500ms
        then:
          - lambda: |-
              id(back_light).toggle().perform();
      - min_length: 10000ms
        max_length: 15000ms
        then:
          - switch.turn_on: factrst

font:
