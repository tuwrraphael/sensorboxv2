display:
  - platform: ili9xxx    
    model: ILI9341
    cs_pin: GPIO03
    dc_pin: GPIO04
    reset_pin: GPIO06
    color_order: bgr
    invert_colors: false
    dimensions:
      height: 320
      width: 240
    auto_clear_enabled: false
    id: display0
    update_interval: never

uart:
  - tx_pin: GPIO08
    rx_pin: GPIO07
    baud_rate: 9600
    id: uart_pms

spi:
  clk_pin: GPIO01
  mosi_pin: GPIO02
  miso_pin: GPIO16

i2c:
  - sda: GPIO11
    scl: GPIO12
    scan: true
    id: i2c_main

  - sda: GPIO18
    scl: GPIO17
    scan: false
    id: i2c_2

time:
  - platform: homeassistant
    id: time_comp
    timezone: Europe/Vienna
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update

script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: text_time
          text:
            format: "%02d:%02d"
            args: [ id(time_comp).now().hour, id(time_comp).now().minute ]

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 5s
    disabled_by_default: True

  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    cpu_frequency:
      name: "CPU Frequency"

  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    update_interval: 60s

  - platform: aht10
    i2c_id: i2c_main
    variant: AHT20
    temperature:
      name: "AHT20 Temperature"
      id: temp_aht20
      on_value:
      - lvgl.label.update:
          id: text_temp
          text:
            format: "%.1f °C"
            args: [ 'x' ]
    humidity:
      name: "AHT20 Humidity"
      id: hum_aht20
      on_value:
      - lvgl.label.update:
          id: text_hum
          text:
            format: "%.1f %%"
            args: [ 'x' ]
    update_interval: 10s

  - platform: bmp280_i2c
    address: 0x77
    i2c_id: i2c_main
    temperature:
      name: "BMP280 Temperature"
      id: temp_bmp280
      oversampling: 16x
    pressure:
      name: "BMP280 Pressure"
      id: pres_bmp280
      on_value:
      - lvgl.label.update:
          id: text_pres
          text:
            format: "%.1f hPa"
            args: [ 'x' ]
    update_interval: 10s

  - platform: scd4x
    i2c_id: i2c_main
    co2:
      name: "SCD40 CO2"
      id: co2_scd40
      on_value:
      - lvgl.indicator.update:
          id: val_co2
          value: !lambda return x;
      - lvgl.label.update:
          id: text_co2
          text:
            format: "%.0f ppm"
            args: [ 'x' ]
    temperature:
      name: "SCD40 Temperature"
      id: temp_scd40
    humidity:
      name: "SCD40 Humidity"
      id: hum_scd40
    update_interval: 30s

  - platform: sgp30
    i2c_id: i2c_main
    address: 0x58
    eco2:
      name: "SGP30 eCO2"
      id: eco2_sgp30
      accuracy_decimals: 0
      filters: 
        - exponential_moving_average: 
            send_every: 1
            alpha: 0.2
    tvoc:
      name: "SGP30 TVOC"
      id: tvoc_sgp30
      accuracy_decimals: 1
      filters: 
        - exponential_moving_average: 
            send_every: 1
            alpha: 0.2
      on_value:
      - lvgl.indicator.update:
          id: val_voc
          value: !lambda return x;
      - lvgl.label.update:
          id: text_voc
          text:
            format: "%.0f ppb"
            args: [ 'x' ]
    store_baseline: yes
    update_interval: 5s
    compensation: 
      humidity_source: hum_aht20
      temperature_source: temp_aht20

  - platform: pmsx003
    type: PMSX003 
    update_interval: 120s
    uart_id: uart_pms
    pm_1_0:
      name: "PMS Particulate Matter <1.0µm Concentration"
      id: pm1_pms
    pm_2_5:
      name: "PMS Particulate Matter <2.5µm Concentration"
      id: pm25_pms
      on_value:
      - lvgl.indicator.update:
          id: val_pm25
          value: !lambda return x;
      - lvgl.label.update:
          id: text_pm25
          text:
            format: "%.0f µg/m³"
            args: [ 'x' ]
    pm_10_0:
      name: "PMS Particulate Matter <10.0µm Concentration"
      id: pm10_pms

  - platform: ina226
    address: 0x40
    shunt_resistance: 0.1 ohm
    max_current: 0.8A
    update_interval: 1s
    current:
      name: "INA226 Current"
      id: ina226_current
      internal: true
    power:
      name: "INA226 Power"
      id: ina226_power
      internal: true
    bus_voltage:
      name: "INA226 Bus Voltage"
      id: ina226_bus_voltage
      internal: true
    shunt_voltage:
      name: "INA226 Shunt Voltage"
      id: ina226_shunt_voltage
      internal: true
    i2c_id: i2c_2

  - platform: total_daily_energy
    name: "INA226 Daily Energy"
    power_id: ina226_power
    unit_of_measurement: Wh
    accuracy_decimals: 2
    id: ina226_daily_energy
    internal: true

  - platform: template
    name: "Raumklimasensor Current"
    lambda: |-
      if (id(ina226_current).state) {
        return (id(ina226_current).state);
      } else {
        return 0;
      }
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 4
    update_interval: 10s
  
  - platform: template
    name: "Raumklimasensor Voltage"
    lambda: |-
      if (id(ina226_bus_voltage).state) {
        return (id(ina226_bus_voltage).state);
      } else {
        return 0;
      }
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s

  - platform: template
    name: "Raumklimasensor Power"
    lambda: |-
      if (id(ina226_power).state) {
        return (id(ina226_power).state);
      } else {
        return 0;
      }
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s

  - platform: template
    name: "Raumklimasensor Energy Heute"
    lambda: |-
      if (id(ina226_daily_energy).state) {
        return (id(ina226_daily_energy).state);
      } else {
        return 0;
      }
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: 10s

switch:
  - platform: factory_reset
    id: factrst